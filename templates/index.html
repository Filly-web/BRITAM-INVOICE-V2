<!DOCTYPE html><html><head><title>Britam EFD Portal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head><body><nav class="navbar navbar-dark"><div class="container"><span class="navbar-brand">Britam EFD Portal</span></div></nav><div class="container mt-4"><div class="hero"><h2>Invoice Verification Portal</h2><p>Generate TRA verification links and QR codes.</p></div><div class="row mb-3"><div class="col"><div class="card stat-card card-blue"><div class="card-body"><h6>Total Processed</h6><h2>{{total}}</h2></div></div></div><div class="col"><div class="card stat-card card-green"><div class="card-body"><h6>Today</h6><h2>{{today}}</h2></div></div></div></div><div class="card"><div class="card-body"><form action="/process" method="post" enctype="multipart/form-data"><input class="form-control mb-2" type="file" name="invoice" accept=".docx" required><input class="form-control mb-2" type="text" name="verification_code" placeholder="Verification Code" required><input class="form-control mb-2" type="text" name="verification_time" placeholder="HHMMSS" required><button class="btn btn-primary">Generate Invoice</button> <a href="/history" class="btn btn-secondary">History</a></form></div></div></div></body></html>
